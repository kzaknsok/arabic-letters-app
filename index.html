<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arabic Letters App - Stroke Recognizer</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #050507;
            background-image:
                radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.05) 0px, transparent 50%),
                linear-gradient(180deg, #09090b 0%, #18181b 50%, #050507 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f4f4f5;
            overflow-x: hidden;
        }

        .card {
            position: relative;
            background: rgba(18, 18, 20, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 24px;
            box-shadow:
                0 30px 60px -12px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        select,
        button {
            padding: 12px 16px;
            font-size: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f4f4f5;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        select {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(8px);
            color: #f4f4f5;
            cursor: pointer;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        select option {
            background: #18181b;
            color: #f4f4f5;
        }

        button {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.8) 0%, rgba(37, 99, 235, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .pos-btns {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pos-btn {
            flex: 1;
            padding: 8px 0;
            font-size: 13px;
            background: transparent;
            border: 1px solid transparent;
            color: #71717a;
            border-radius: 12px;
            box-shadow: none;
        }

        .pos-btn.active {
            background: rgba(255, 255, 255, 0.07);
            color: #38bdf8;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 22px;
            background: rgba(9, 9, 11, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                inset 0 4px 20px rgba(0, 0, 0, 0.8),
                0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #guideCanvas {
            z-index: 1;
        }

        #drawCanvas {
            z-index: 2;
        }

        #status {
            margin-top: 16px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.05em;
            height: 28px;
            color: #38bdf8;
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
        }

        .bottom-btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .bottom-btns button {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #a1a1aa;
            box-shadow: none;
        }

        .bottom-btns button:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #f4f4f5;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="controls">
            <select id="letterSelect" style="flex: 2;"></select>
            <button id="btnSound" style="flex: 1;">🔊 発音</button>
        </div>

        <div class="pos-btns" id="posGroup">
            <button class="pos-btn active" data-pos="0">独立</button>
            <button class="pos-btn" data-pos="1">語頭</button>
            <button class="pos-btn" data-pos="2">語中</button>
            <button class="pos-btn" data-pos="3">語尾</button>
        </div>

        <div class="canvas-container">
            <canvas id="guideCanvas" width="450" height="450"></canvas>
            <canvas id="drawCanvas" width="450" height="450"></canvas>
        </div>

        <div id="status"></div>

        <div class="bottom-btns">
            <button id="btnClear">クリア</button>
        </div>
    </div>

    <script>
        const ARABIC_LETTERS = [
            { id: 1, name: "1. Alif (アリフ)", forms: ["ا", "ا", "ـا", "ـا"] },
            { id: 2, name: "2. Ba (バー)", forms: ["ب", "بـ", "ـبـ", "ـب"] },
            { id: 3, name: "3. Ta (ター)", forms: ["ت", "تـ", "ـتـ", "ـت"] },
            { id: 4, name: "4. Tha (サー)", forms: ["ث", "ثـ", "ـثـ", "ـث"] },
            { id: 5, name: "5. Jim (ジーム)", forms: ["ج", "جـ", "ـجـ", "ـج"] },
            { id: 6, name: "6. Ha (ハー)", forms: ["ح", "حـ", "ـحـ", "ـح"] },
            { id: 7, name: "7. Kha (ハー)", forms: ["خ", "خـ", "ـخـ", "ـخ"] },
            { id: 8, name: "8. Dal (ダール)", forms: ["د", "د", "ـد", "ـد"] },
            { id: 9, name: "9. Dhal (ザール)", forms: ["ذ", "ذ", "ـذ", "ـذ"] },
            { id: 10, name: "10. Ra (ラー)", forms: ["ر", "ر", "ـر", "ـر"] },
            { id: 11, name: "11. Zay (ザイ)", forms: ["ز", "ز", "ـز", "ـز"] },
            { id: 12, name: "12. Sin (シーン)", forms: ["س", "سـ", "ـسـ", "ـس"] },
            { id: 13, name: "13. Shin (シーン)", forms: ["ش", "شـ", "ـشـ", "ـش"] },
            { id: 14, name: "14. Sad (サード)", forms: ["ص", "صـ", "ـصـ", "ـص"] },
            { id: 15, name: "15. Dad (ダード)", forms: ["ض", "ضـ", "ـضـ", "ـض"] },
            { id: 16, name: "16. Ta (ター/強調)", forms: ["ط", "طـ", "ـطـ", "ـط"] },
            { id: 17, name: "17. Dha (ザー/強調)", forms: ["ظ", "ظـ", "ـظـ", "ـظ"] },
            { id: 18, name: "18. Ayn (アイン)", forms: ["ع", "عـ", "ـعـ", "ـع"] },
            { id: 19, name: "19. Ghayn (ガイン)", forms: ["غ", "غـ", "ـغـ", "ـغ"] },
            { id: 20, name: "20. Fa (ファー)", forms: ["ف", "فـ", "ـفـ", "ـف"] },
            { id: 21, name: "21. Qaf (カーフ)", forms: ["ق", "قـ", "ـقـ", "ـق"] },
            { id: 22, name: "22. Kaf (カーフ)", forms: ["ك", "كـ", "ـكـ", "ـك"] },
            { id: 23, name: "23. Lam (ラーム)", forms: ["ل", "لـ", "ـلـ", "ـل"] },
            { id: 24, name: "24. Mim (ミーム)", forms: ["م", "مـ", "ـمـ", "ـم"] },
            { id: 25, name: "25. Nun (ヌーン)", forms: ["ن", "نـ", "ـنـ", "ـن"] },
            { id: 26, name: "26. Ha (ハー)", forms: ["ه", "هـ", "ـهـ", "ـه"] },
            { id: 27, name: "27. Waw (ワウ)", forms: ["و", "و", "ـو", "ـو"] },
            { id: 28, name: "28. Ya (ヤー)", forms: ["ي", "يـ", "ـيـ", "ـي"] }
        ];

        let currentLetterIndex = 0;
        let currentPosIndex = 0;
        let isDrawing = false;
        let isCompleted = false;

        // ユーザーが描いた点群データ（軌跡）
        let userPoints = [];
        // ガイド文字から自動抽出したお手本点群データ
        let templatePoints = [];

        const NUM_POINTS = 64; // リサンプルする点の数

        const letterSelect = document.getElementById('letterSelect');
        const guideCanvas = document.getElementById('guideCanvas');
        const drawCanvas = document.getElementById('drawCanvas');
        const guideCtx = guideCanvas.getContext('2d');
        const drawCtx = drawCanvas.getContext('2d');
        const btnSound = document.getElementById('btnSound');
        const btnClear = document.getElementById('btnClear');
        const statusDiv = document.getElementById('status');
        const posButtons = document.querySelectorAll('.pos-btn');

        function init() {
            ARABIC_LETTERS.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = item.name;
                letterSelect.appendChild(opt);
            });

            letterSelect.addEventListener('change', (e) => {
                currentLetterIndex = parseInt(e.target.value);
                renderAll();
            });

            posButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    posButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentPosIndex = parseInt(e.target.getAttribute('data-pos'));
                    renderAll();
                });
            });

            btnSound.addEventListener('click', playSound);
            btnClear.addEventListener('click', clearUserCanvas);

            setupDrawingEvents();
            renderAll();
        }

        function renderAll() {
            clearUserCanvas();
            drawGuideAndExtractTemplate();
        }

        // ガイド文字を描画し、同時にピクセル群から「お手本ストロークデータ」を生成
        function drawGuideAndExtractTemplate() {
            guideCtx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);

            // 基準線
            guideCtx.strokeStyle = 'rgba(244, 63, 94, 0.25)';
            guideCtx.lineWidth = 1.5;
            guideCtx.setLineDash([8, 8]);
            guideCtx.beginPath();
            guideCtx.moveTo(0, 300); guideCtx.lineTo(450, 300);
            guideCtx.stroke();
            guideCtx.setLineDash([]);

            // ガイド文字
            const char = ARABIC_LETTERS[currentLetterIndex].forms[currentPosIndex];
            guideCtx.font = '280px "Traditional Arabic", "Amiri", "Segoe UI", sans-serif';
            guideCtx.fillStyle = 'rgba(255, 255, 255, 0.22)';
            guideCtx.textAlign = 'center';
            guideCtx.textBaseline = 'alphabetic';
            guideCtx.fillText(char, 225, 300);

            // ガイド描画のピクセル位置から「お手本の点群」を抽出・生成する
            const imgData = guideCtx.getImageData(0, 0, 450, 450).data;
            let rawPoints = [];

            // ピクセルをスキャン（右から左、上から下：アラビア語の運筆傾向に合わせる）
            for (let x = 449; x >= 0; x -= 4) {
                for (let y = 0; y < 450; y += 4) {
                    const idx = (y * 450 + x) * 4;
                    if (imgData[idx + 3] > 30) { // 文字のピクセルが存在する
                        rawPoints.push({ x: x, y: y });
                    }
                }
            }

            if (rawPoints.length > 0) {
                templatePoints = normalizeStroke(rawPoints);
            }
        }

        function clearUserCanvas() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            statusDiv.textContent = '';
            userPoints = [];
            isCompleted = false;
        }

        function playSound() {
            const letterId = ARABIC_LETTERS[currentLetterIndex].id;
            const audio = new Audio(`audio/${letterId}.mp3`);
            audio.play().catch(err => console.error("Audio play error:", err));
        }

        function setupDrawingEvents() {
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.lineWidth = 16;
            drawCtx.strokeStyle = '#38bdf8';

            const getPos = (e) => {
                const rect = drawCanvas.getBoundingClientRect();
                const scaleX = drawCanvas.width / rect.width;
                const scaleY = drawCanvas.height / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            };

            const startDraw = (e) => {
                if (isCompleted) return;
                isDrawing = true;
                userPoints = [];
                const pos = getPos(e);
                userPoints.push(pos);
                drawCtx.beginPath();
                drawCtx.moveTo(pos.x, pos.y);
            };

            const moveDraw = (e) => {
                if (!isDrawing || isCompleted) return;
                const pos = getPos(e);
                userPoints.push(pos);
                drawCtx.lineTo(pos.x, pos.y);
                drawCtx.stroke();
            };

            const endDraw = () => {
                if (isDrawing) {
                    isDrawing = false;
                    evaluateStroke();
                }
            };

            drawCanvas.addEventListener('pointerdown', startDraw);
            drawCanvas.addEventListener('pointermove', moveDraw);
            drawCanvas.addEventListener('pointerup', endDraw);
            drawCanvas.addEventListener('pointerleave', endDraw);
        }

        // --- $1 Recognizer アルゴリズム核心部 ---

        function evaluateStroke() {
            const w = 450, h = 450;
            const guideData = guideCtx.getImageData(0, 0, w, h).data;
            const drawData = drawCtx.getImageData(0, 0, w, h).data;

            let guidePixelCount = 0;      // ガイド文字の全体の広さ
            let matchedPixelCount = 0;    // ガイドの上を正しく塗れた広さ
            let totalDrawnPixelCount = 0; // ユーザーが塗ったすべての広さ

            for (let i = 0; i < guideData.length; i += 4) {
                const isGuidePixel = guideData[i + 3] > 15;
                const isDrawPixel = drawData[i + 3] > 15;

                if (isGuidePixel) {
                    guidePixelCount++;
                    if (isDrawPixel) {
                        matchedPixelCount++;
                    }
                }

                if (isDrawPixel) {
                    totalDrawnPixelCount++;
                }
            }

            if (guidePixelCount === 0 || totalDrawnPixelCount === 0) return;

            // 1. カバー率：ガイドの何％を塗れたか（例: 50%以上塗れていればOK！）
            const coverageRatio = matchedPixelCount / guidePixelCount;

            // 2. 精度：塗った面積のうち、ガイドからはみ出ていない割合（例: 40%以上がガイド内ならOK！）
            const precisionRatio = matchedPixelCount / totalDrawnPixelCount;

            // 塗りつぶすと precisionRatio（精度）が 10%〜20% 以下に激減するため不合格になります。
            // 一方で、少しくらい手ぶれしてはみ出しても 40% 以上はキープできるため、普通になぞれば合格できます！

            if (coverageRatio >= 0.50 && precisionRatio >= 0.40) {
                isCompleted = true;
                statusDiv.textContent = '✨ PERFECT!';
                playSound();
            } else {
                // 失敗してもプレッシャーを与えないメッセージ
                statusDiv.textContent = 'もう少しなぞってみよう！';
                setTimeout(() => {
                    if (!isCompleted) statusDiv.textContent = '';
                }, 1200);
            }
        }

        // ストローク（点群）の正規化処理
        function normalizeStroke(points) {
            let pts = resample(points, NUM_POINTS);
            pts = scaleTo(pts, 200); // 200x200 の標準サイズにスケーリング
            pts = translateTo(pts, { x: 0, y: 0 }); // 原点に移動
            return pts;
        }

        // 点の数を一定（NUM_POINTS）にリサンプルする
        function resample(points, n) {
            const I = pathLength(points) / (n - 1);
            let D = 0.0;
            let newPoints = [points[0]];

            for (let i = 1; i < points.length; i++) {
                let d = distance(points[i - 1], points[i]);
                if ((D + d) >= I) {
                    let qx = points[i - 1].x + ((I - D) / d) * (points[i].x - points[i - 1].x);
                    let qy = points[i - 1].y + ((I - D) / d) * (points[i].y - points[i - 1].y);
                    let q = { x: qx, y: qy };
                    newPoints.push(q);
                    points.splice(i, 0, q);
                    D = 0.0;
                } else {
                    D += d;
                }
            }

            if (newPoints.length === n - 1) {
                newPoints.push(points[points.length - 1]);
            }
            return newPoints;
        }

        // 2点間の距離
        function distance(p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // 全体のパス長
        function pathLength(points) {
            let d = 0;
            for (let i = 1; i < points.length; i++) {
                d += distance(points[i - 1], points[i]);
            }
            return d;
        }

        // 縦横比を維持しながらバウンディングボックスにサイズを正規化
        function scaleTo(points, size) {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let p of points) {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            }
            const width = maxX - minX;
            const height = maxY - minY;
            const scale = Math.max(width, height);

            return points.map(p => ({
                x: (p.x - minX) / (scale || 1) * size,
                y: (p.y - minY) / (scale || 1) * size
            }));
        }

        // 重心を原点(0,0)へ平行移動
        function translateTo(points, pt) {
            let c = centroid(points);
            return points.map(p => ({
                x: p.x - c.x + pt.x,
                y: p.y - c.y + pt.y
            }));
        }

        // 重心を求める
        function centroid(points) {
            let x = 0, y = 0;
            for (let p of points) {
                x += p.x;
                y += p.y;
            }
            return { x: x / points.length, y: y / points.length };
        }

        // 2つの点群間の平均距離（点対点の距離）を求める
        function pathDistance(pts1, pts2) {
            if (pts1.length !== pts2.length) return Infinity;
            let d = 0.0;
            for (let i = 0; i < pts1.length; i++) {
                d += distance(pts1[i], pts2[i]);
            }
            return d / pts1.length;
        }

        window.onload = init;
    </script>

</body>

</html>
